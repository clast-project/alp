name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    # windows-latest is required for the net472 build/test of the test
    # and benchmark projects, which exercise the netstandard2.0 build of
    # the library on the .NET Framework runtime.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore alp.sln

      - name: Build
        run: dotnet build alp.sln -c Release --no-restore

      - name: Test
        run: dotnet test tests/Alp.Tests/Alp.Tests.csproj -c Release --no-build --verbosity normal

      - name: Pack
        run: dotnet pack src/Alp/Alp.csproj -c Release --no-build -o artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
